<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acompanhamento AMS · Dexterity</title>
<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<!-- Vercel Speed Insights -->
<script defer src="/_vercel/speed-insights/script.js"></script>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root{ --offwhite:#F5F6F7; --grafite:#1D2D3E; --cerceta:#0070F2; --teal:#17A398;
    --amarelo:#E76500; --musgo:#188918; --err:#BB0000; --linha:#D9D9D9; --cartao:#fff;
    --muted:#64748B; --muted2:#94A3B8; --trilho:#EEF1F8; --linha2:#E2E8F0; --texto2:#475569;
    --tintlo:#FEFBEB; --tinthi:#FEF2F2;
    --sombra:0 0 0 1px rgba(34,54,79,.02), 0 1px 4px rgba(34,54,79,.10); }
  /* Modo escuro automático (segue a preferência do sistema do cliente). */
  @media (prefers-color-scheme:dark){ :root{
    --offwhite:#0E1726; --grafite:#E6EDF6; --cartao:#16212F; --linha:#2B3A4D; --linha2:#2B3A4D;
    --teal:#2BB6AA; --cerceta:#4D9BFF; --amarelo:#F0883E; --musgo:#2EA043; --err:#F2555A;
    --muted:#93A4BA; --muted2:#7E90A6; --trilho:#22303F; --texto2:#B7C3D3;
    --tintlo:#33270F; --tinthi:#3A1715;
    --sombra:0 0 0 1px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.5); color-scheme:dark; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--offwhite);color:var(--grafite);
    font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:24px clamp(14px,3vw,28px) 56px}
  header{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--linha);padding-bottom:14px;margin-bottom:20px}
  header img{width:38px;height:38px}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  header .ciclo{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--cartao);border:1px solid var(--linha);border-radius:10px;padding:15px 16px;box-shadow:var(--sombra);border-top:3px solid var(--teal)}
  .kpi.warn{border-top-color:var(--amarelo)} .kpi.bad{border-top-color:var(--err)} .kpi.ok{border-top-color:var(--musgo)}
  .kpi .v{font-size:clamp(22px,2.4vw,30px);font-weight:700;line-height:1.05}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:7px}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
  .card{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:18px;box-shadow:var(--sombra);margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:700}
  .bar{position:relative;background:var(--trilho);border-radius:7px;height:20px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:7px}
  .bar-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:7px;flex-wrap:wrap;color:var(--texto2)}
  .months{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
  .mc{border:1px solid var(--linha);border-radius:8px;padding:9px 10px;text-align:center}
  .mc .mm{font-size:11px;color:var(--muted)} .mc .mh{font-weight:700;font-size:15px;margin-top:2px}
  .mc.lo{border-color:#E7B100;background:var(--tintlo)} .mc.hi{border-color:#D20A0A;background:var(--tinthi)}
  .cham{display:flex;flex-direction:column;gap:10px}
  .cham-row{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center}
  .cham-row .m{font-size:12px;color:var(--muted)}
  .cham-bars{display:flex;flex-direction:column;gap:4px}
  .cham-bars .b{height:11px;border-radius:4px;display:flex;align-items:center;min-width:2px}
  .cham-bars .b span{font-size:10px;color:#fff;padding:0 6px;white-space:nowrap}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .barlist{display:flex;flex-direction:column;gap:11px}
  .blrow{font-size:13px}
  .blrow .top{display:flex;justify-content:space-between;gap:10px}
  .blrow .t{background:var(--trilho);border-radius:6px;height:9px;margin-top:4px;overflow:hidden}
  .blrow .t i{display:block;height:100%;background:var(--teal);border-radius:6px}
  .blrow .val{font-variant-numeric:tabular-nums;font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .estado{padding:46px;text-align:center;color:var(--muted)}
  .foot{margin-top:24px;font-size:11.5px;color:var(--muted2);text-align:center}
  /* Série temporal premium (crosshair + readout) */
  .tsc{--tsc-h:240px;width:100%}
  .tsc-legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .tsc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .tsc-plot{position:relative;height:var(--tsc-h)}
  .tsc-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .tsc-grid{stroke:var(--linha2);stroke-width:1}
  .tsc-meta{stroke:var(--muted2);stroke-width:1.4;stroke-dasharray:5 4}
  .tsc-line{stroke-dasharray:2600;stroke-dashoffset:2600;animation:acDraw 1s ease forwards}
  .tsc-area{opacity:0;animation:acFade .8s ease .25s forwards}
  @keyframes acDraw{to{stroke-dashoffset:0}} @keyframes acFade{to{opacity:1}}
  .tsc-yl{position:absolute;left:0;transform:translateY(-50%);font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;width:40px;text-align:right}
  .tsc-xl{position:absolute;bottom:2px;transform:translateX(-50%);font-size:11px;color:var(--muted2);white-space:nowrap}
  .tsc-cross{position:absolute;top:14px;bottom:30px;width:1px;background:var(--muted2);opacity:0;transition:opacity .1s}
  .tsc-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cartao);border:2px solid;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s;box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .tsc.on .tsc-cross,.tsc.on .tsc-dot{opacity:1}
  .tsc-read{position:absolute;top:6px;transform:translateX(-50%);background:#0f1f33;color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;box-shadow:0 10px 28px rgba(15,31,51,.32);z-index:5;min-width:118px}
  .tsc.on .tsc-read{opacity:1} .tsc-read.flip{transform:translateX(-100%) translateX(-12px)}
  .tsc-read .h{font-weight:700;margin-bottom:5px;font-size:11.5px;color:#cfe0f5;letter-spacing:.3px}
  .tsc-read .r{display:flex;align-items:center;gap:7px;line-height:1.7}
  .tsc-read .r i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .tsc-read .r span{color:#b8c6da;margin-right:8px} .tsc-read .r b{margin-left:auto;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){ .tsc-line,.tsc-area{animation:none;stroke-dashoffset:0;opacity:1} }
  .tm{width:100%} .tm-svg{width:100%;height:auto;display:block;max-height:380px}
  .tm-svg g{transition:opacity .12s} .tm-svg:hover g{opacity:.8} .tm-svg:hover g:hover{opacity:1}
  .tm-n{fill:#fff;font-weight:700;font-size:17px} .tm-v{fill:rgba(255,255,255,.86);font-size:14px}
  @media (max-width:720px){ .kpis{grid-template-columns:repeat(2,1fr)} header .ciclo{margin-left:0;flex-basis:100%;text-align:left} }
  /* 🔐 Entrada (login / definir senha) — centralizada e estreita, sem nada em volta. */
  .ent{max-width:390px;margin:6vh auto 0}
  .ent .card{padding:24px}
  .ent h2{font-size:16px;margin:0 0 4px} .ent .ex{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .cpo{margin-bottom:12px}
  .cpo label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
  .cpo input{width:100%;padding:10px 12px;border:1px solid var(--linha);border-radius:8px;font:inherit;
    background:var(--cartao);color:var(--grafite)}
  .cpo input:focus{outline:2px solid var(--cerceta);outline-offset:-1px;border-color:var(--cerceta)}
  .bt{width:100%;padding:11px 14px;border:0;border-radius:8px;background:var(--cerceta);color:#fff;
    font:inherit;font-weight:700;cursor:pointer}
  .bt:disabled{opacity:.6;cursor:progress}
  .bt.sec{background:transparent;color:var(--cerceta);border:1px solid var(--linha);font-weight:600;width:auto;padding:6px 12px}
  .msg{border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
  .msg.err{background:var(--tinthi);color:var(--err);border:1px solid var(--err)}
  .msg.ok{background:#EAF6EC;color:var(--musgo);border:1px solid var(--musgo)}
  :root[data-theme="dark"] .msg.ok,@media (prefers-color-scheme:dark){ .msg.ok{background:#16301F} }
  .dica{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
  /* Barra de quem está logado */
  .eu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
    border-bottom:1px solid var(--linha);padding-bottom:10px;margin-bottom:16px}
  .eu .sp{margin-left:auto}
  /* Lista de chamados */
  .ch-tab{width:100%;border-collapse:collapse;font-size:13px}
  .ch-tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    border-bottom:2px solid var(--linha);padding:7px 8px 7px 0;font-weight:700;white-space:nowrap}
  .ch-tab td{border-bottom:1px solid var(--linha);padding:8px 8px 8px 0;vertical-align:top}
  .ch-tab td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ch-tab tr:last-child td{border-bottom:0}
  .ch-k{font-weight:700;white-space:nowrap}
  .fase{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .fase.aberto{background:#FEF2F2;color:#B91C1C} .fase.andamento{background:#FEFBEB;color:#8A5200}
  .fase.concluido{background:#EAF6EC;color:#0E6B37}
  @media (prefers-color-scheme:dark){ .fase.aberto{background:#3A1715;color:#F09A9A}
    .fase.andamento{background:#33270F;color:#F0C674} .fase.concluido{background:#16301F;color:#8FD3A8} }
  .ch-filtro{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .ch-filtro button{border:1px solid var(--linha);background:var(--cartao);color:var(--texto2);border-radius:999px;
    padding:5px 13px;font:inherit;font-size:12.5px;cursor:pointer}
  .ch-filtro button[aria-pressed="true"]{border-color:var(--cerceta);color:var(--cerceta);font-weight:700}
  @media (max-width:720px){ .ch-tab .esc{display:none} }

  /* =====================================================================
     🌐 PORTAL DO PROJETO (modo projeto, 2026-09-28) — visual Dexterity.
     Tudo aqui é escopado em body.pj: o AMS de sempre (e o link ?c= antigo)
     continua com o visual que tinha. Os tokens ganham os valores da marca
     (areia #F7F3E7, verde-petróleo #009994, texto #4D4D4D) só neste modo.
     ===================================================================== */
  body.pj{ --offwhite:#F7F3E7; --grafite:#3B3B3B; --cerceta:#00817D; --teal:#009994; --linha:#E3DCC8; --linha2:#EDE7D6;
    --trilho:#EFE9DA; --muted:#6E6A60; --muted2:#7A7568; --texto2:#5C5850; --musgo:#1E7A46; --amarelo:#B45309; --err:#B3261E;
    --sombra:0 0 0 1px rgba(77,77,77,.03), 0 1px 4px rgba(77,66,40,.10) }
  @media (prefers-color-scheme:dark){ body.pj{ --offwhite:#0E1726; --grafite:#E6EDF6; --cerceta:#2BB6AA; --teal:#2BB6AA;
    --linha:#2B3A4D; --linha2:#2B3A4D; --trilho:#22303F; --muted:#93A4BA; --muted2:#7E90A6; --texto2:#B7C3D3;
    --musgo:#2EA043; --amarelo:#F0883E; --err:#F2555A; --sombra:0 0 0 1px rgba(0,0,0,.25), 0 2px 10px rgba(0,0,0,.5) } }
  body.pj header{align-items:flex-start}
  body.pj header img{margin-top:2px}
  body.pj header h1{font-size:20px;line-height:1.2}
  body.pj header h1 .cli{color:var(--cerceta)}
  body.pj header h1 .sep{color:var(--muted2);font-weight:400;margin:0 2px}
  body.pj header .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lnk{border:0;background:none;color:var(--cerceta);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
  .lnk:hover{text-decoration:underline}
  /* Botões-link do cabeçalho e do rodapé: Teams em destaque, pasta como apoio. */
  .pj-acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pjb{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;
    text-decoration:none;white-space:nowrap;border:1px solid var(--linha);background:var(--cartao);color:var(--cerceta);cursor:pointer;font-family:inherit}
  .pjb.pri{background:var(--cerceta);border-color:var(--cerceta);color:#fff}
  .pjb:hover{filter:brightness(.96)}
  .pj-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pj-nav .sp{flex:1}
  .pj-sel{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--linha);border-radius:8px;background:var(--cartao);color:var(--grafite);max-width:100%}
  .pj-tabs{display:flex;gap:6px;flex-wrap:wrap}
  .pj-tab{border:1px solid var(--linha);background:var(--cartao);color:var(--texto2);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
  .pj-tab[aria-selected="true"]{border-color:var(--cerceta);color:var(--cerceta);font-weight:700}
  .pj-prev{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--cerceta);border-radius:10px;padding:9px 12px;
    font-size:12.5px;color:var(--texto2);margin-bottom:16px;background:var(--cartao)}
  .pj-apre{font-size:14.5px;line-height:1.6;border-left:4px solid var(--teal)}
  .card h2 .pill{margin-left:8px;vertical-align:middle}
  .card h2 .n{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
  body.pj .kpis{margin-bottom:0}
  body.pj .kpi{min-width:0}   /* o texto de uma linha abaixo não pode alargar a coluna da grade (celular) */
  body.pj .kpi .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Pastilhas de situação (as mesmas cores do semáforo do Cronograma interno). */
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap;line-height:1.6}
  .pill.ok{background:#EAF6EC;color:#0E6B37} .pill.warn{background:#FEFBEB;color:#8A5200}
  .pill.bad{background:#FEF2F2;color:#B91C1C} .pill.info{background:#E6F4F3;color:#00615E} .pill.mut{background:var(--trilho);color:var(--muted)}
  @media (prefers-color-scheme:dark){ .pill.ok{background:#16301F;color:#8FD3A8} .pill.warn{background:#33270F;color:#F0C674}
    .pill.bad{background:#3A1715;color:#F09A9A} .pill.info{background:#0F2E2C;color:#7ED8CF} }
  /* Listas dos blocos (pendências, decisões, riscos, reuniões) */
  .pj-lista{display:flex;flex-direction:column}
  .pj-it{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--linha2)}
  .pj-it:first-child{border-top:0;padding-top:0} .pj-it:last-child{padding-bottom:0}
  .pj-it .ico{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--trilho);font-size:15px}
  .pj-it .tx{flex:1;min-width:0}
  .pj-it .t{font-weight:600;font-size:13.5px}
  .pj-it .t .tag{font-weight:600;font-size:11px;color:var(--muted);background:var(--trilho);border-radius:6px;padding:1px 6px;margin-left:2px;vertical-align:middle;white-space:nowrap}
  .pj-it .d{font-size:12.5px;color:var(--texto2);margin-top:3px;line-height:1.5}
  .pj-it .m{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
  .pj-it .ac{flex:0 0 auto}
  .pj-reu .dt{flex:0 0 76px;text-align:center;border:1px solid var(--linha);border-radius:8px;padding:5px 4px;line-height:1.25}
  .pj-reu .dt b{display:block;font-size:15px} .pj-reu .dt span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  details.pj-mais{margin-top:12px;border-top:1px solid var(--linha2);padding-top:10px}
  details.pj-mais>summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;min-height:28px}
  details.pj-mais>summary::-webkit-details-marker{display:none}
  details.pj-mais>summary::before{content:'▸';display:inline-block;transition:transform .15s} details.pj-mais[open]>summary::before{transform:rotate(90deg)}
  details.pj-mais>.pj-lista{margin-top:8px;opacity:.85}
  /* FAQ em acordeão */
  .pj-faq{border-top:1px solid var(--linha2)} .pj-faq:first-of-type{border-top:0}
  .pj-faq>summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:11px 0;list-style:none;display:flex;gap:10px;align-items:center;min-height:44px}
  .pj-faq>summary::-webkit-details-marker{display:none}
  .pj-faq>summary::after{content:'+';margin-left:auto;color:var(--cerceta);font-size:18px;font-weight:400;flex:0 0 auto}
  .pj-faq[open]>summary::after{content:'−'}
  .pj-faq>.r{font-size:13.5px;color:var(--texto2);line-height:1.6;padding:0 0 12px 0;white-space:pre-line}
  /* Time do projeto */
  .pj-eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .pj-pes{display:flex;gap:10px;align-items:center;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;min-width:0}
  .pj-pes .av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
  .pj-pes .n{font-weight:700;font-size:13.5px} .pj-pes .p{font-size:12px;color:var(--muted)} .pj-pes .c{font-size:12px;color:var(--cerceta);word-break:break-word}
  .pj-pes .tx{min-width:0}
  /* Links úteis em chips */
  .pj-chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;
    color:var(--cerceta);background:var(--cartao);text-decoration:none;max-width:100%}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{border-color:var(--cerceta)}
  /* Cronograma: SVG simples, rola na horizontal dentro do bloco quando não cabe. */
  .pj-cr-wrap{display:flex;align-items:flex-start}
  .pj-cr-lab{flex:0 0 220px;min-width:0;border-right:1px solid var(--linha2)}
  .pj-cr-lab .h{height:34px}
  .pj-cr-lab .r{height:30px;display:flex;align-items:center;gap:7px;padding:0 8px 0 2px;font-size:12px;min-width:0}
  .pj-cr-lab .r:nth-child(odd){background:color-mix(in srgb,var(--trilho) 45%,transparent)}
  .pj-cr-lab .r i{flex:0 0 auto;width:8px;height:8px;border-radius:50%}
  .pj-cr-lab .r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pj-cr{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pj-cr svg{display:block;font-family:inherit}

<body>
<div class="wrap">
  <header>
    <img src="/logo.svg" alt="Dexterity">
    <div>
      <h1 id="titulo">Acompanhamento AMS</h1>
      <div class="sub" id="sub">carregando…</div>
    </div>
    <div class="ciclo" id="ciclo"></div>
  </header>
  <div id="conteudo"><div class="estado">Carregando…</div></div>
  <div class="foot">Painel somente-leitura · Dexterity IT · atualizado a cada acesso</div>
</div>
<script>
const fmtH=(seg)=>{ const h=Math.floor((seg||0)/3600), m=Math.round(((seg||0)%3600)/60);
  return h&&m?`${h}h${String(m).padStart(2,'0')}`:h?`${h}h`:`${m}m`; };
const fmtBRL=(v)=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escA=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PALETA=['#17A398','#0070F2','#E76500','#7858FF','#188918','#D20A0A','#7CB342','#C0399F'];
// Treemap (squarified) — área proporcional ao valor, com rótulo por célula.
function treemap(items, opts){
  opts=opts||{}; const fmt=opts.fmt||(v=>String(v));
  items=(items||[]).filter(i=>(+i.valor)>0).slice().sort((a,b)=>b.valor-a.valor);
  if(!items.length) return '<div class="estado">Sem dados.</div>';
  const W=1000,H=opts.h||380; const total=items.reduce((s,i)=>s+(+i.valor),0)||1;
  const nodes=items.map(it=>({it, area:(+it.valor)/total*(W*H)}));
  let x=0,y=0,w=W,h=H,i=0; const placed=[];
  const worst=(row,side)=>{ const s=row.reduce((a,n)=>a+n.area,0),mx=Math.max(...row.map(n=>n.area)),mn=Math.min(...row.map(n=>n.area));
    return Math.max((side*side*mx)/(s*s),(s*s)/(side*side*mn)); };
  while(i<nodes.length){ const side=Math.min(w,h); let row=[nodes[i]],j=i+1,cur=worst(row,side);
    while(j<nodes.length){ const t=row.concat(nodes[j]); const wt=worst(t,side); if(wt<=cur){ row=t; cur=wt; j++; } else break; }
    const s=row.reduce((a,n)=>a+n.area,0);
    if(w>=h){ const thick=s/h; let yy=y; row.forEach(n=>{ const hh=n.area/thick; placed.push({it:n.it,x,y:yy,w:thick,h:hh}); yy+=hh; }); x+=thick; w-=thick; }
    else { const thick=s/w; let xx=x; row.forEach(n=>{ const ww=n.area/thick; placed.push({it:n.it,x:xx,y,w:ww,h:thick}); xx+=ww; }); y+=thick; h-=thick; }
    i=j; }
  const rects=placed.map((p,idx)=>{ const c=p.it.cor||PALETA[idx%PALETA.length];
    const showName=p.w>130&&p.h>34, showVal=p.w>56&&p.h>24, px=p.x+11, py=p.y+24, maxch=Math.floor((p.w-18)/8.6);
    const nm=String(p.it.nome||''); const nmS=nm.length>maxch?nm.slice(0,Math.max(1,maxch-1))+'…':nm;
    return `<g><rect x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" width="${Math.max(0,p.w-2).toFixed(1)}" height="${Math.max(0,p.h-2).toFixed(1)}" rx="6" fill="${c}"><title>${esc(nm)}: ${esc(fmt(p.it.valor))}</title></rect>
      ${showName?`<text class="tm-n" x="${px.toFixed(1)}" y="${py.toFixed(1)}">${esc(nmS)}</text>`:''}
      ${showVal?`<text class="tm-v" x="${px.toFixed(1)}" y="${(py+(showName?20:0)).toFixed(1)}">${esc(fmt(p.it.valor))}</text>`:''}</g>`;
  }).join('');
  return `<div class="tm"><svg viewBox="0 0 ${W} ${H}" class="tm-svg" preserveAspectRatio="xMidYMid meet">${rects}</svg></div>`;
}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const labelMes=(ym)=>{ const [y,m]=ym.split('-'); return `${MESES[(+m)-1]}/${y.slice(2)}`; };
const APUR={mensal:'mensal',trimestral:'trimestral',semestral:'semestral',anual:'anual'};

// ===== Motor de série temporal premium (crosshair + readout), igual ao app =====
const _TSC={}; let _tscSeq=0;
function _tscNice(v){ if(v<=0) return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }
function _tscSmooth(P){ if(!P.length) return ''; let d=`M ${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){ const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; } return d; }
function tsChart(series, opts){
  opts=opts||{}; const fmt=opts.fmt||(v=>String(v));
  series=(series||[]).filter(s=>s&&s.vals&&s.vals.length);
  if(!series.length) return '<div class="estado">Sem dados no período.</div>';
  const xs0=series[0].vals.map(p=>p.x); const n=xs0.length;
  const W=1000,H=opts.h||220,padL=opts.padL!=null?opts.padL:42,padR=16,padT=14,padB=30;
  let maxV=0; series.forEach(s=>s.vals.forEach(p=>{ if(p.v>maxV) maxV=p.v; })); if(opts.metaY&&opts.metaY.v>maxV) maxV=opts.metaY.v;
  const niceMax=_tscNice(maxV||1);
  const X=i=> padL + (n>1? i*(W-padL-padR)/(n-1) : (W-padL-padR)/2);
  const Y=v=> padT + (1 - v/niceMax)*(H-padT-padB);
  const xs=xs0.map((_,i)=>X(i)); const pctL=x=>(x/W*100), pctT=y=>(y/H*100);
  const ticks=4; let grid='',yl='';
  for(let t=0;t<=ticks;t++){ const val=niceMax*t/ticks,y=Y(val);
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" class="tsc-grid"/>`;
    yl+=`<span class="tsc-yl" style="top:${pctT(y).toFixed(2)}%">${esc(opts.yfmt?opts.yfmt(val):fmt(val))}</span>`; }
  const every=Math.max(1,Math.ceil(n/9)); let xlab='';
  xs0.forEach((x,i)=>{ if(i%every===0||i===n-1) xlab+=`<span class="tsc-xl" style="left:${pctL(X(i)).toFixed(2)}%">${esc(opts.xlabel?opts.xlabel(x):String(x).slice(5))}</span>`; });
  let metaSvg=''; if(opts.metaY){ const y=Y(opts.metaY.v); metaSvg=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" class="tsc-meta"/>`; }
  const id='tsc'+(++_tscSeq), gid='tg'+_tscSeq; let defs='',paths='';
  const reg={ W,xs, xraw:xs0, series:[], readX:(opts.readX||(x=>x)), fmt:(opts.readFmt||fmt) };
  series.forEach((s,si)=>{ const P=s.vals.map((p,i)=>[X(i),Y(p.v)]); const d=_tscSmooth(P);
    if(s.tipo!=='line'){ const gi=gid+'_'+si; defs+=`<linearGradient id="${gi}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${s.cor}" stop-opacity=".24"/><stop offset="100%" stop-color="${s.cor}" stop-opacity="0"/></linearGradient>`;
      paths+=`<path d="${d} L ${X(n-1).toFixed(1)} ${(H-padB)} L ${X(0).toFixed(1)} ${(H-padB)} Z" fill="url(#${gi})" class="tsc-area"/>`; }
    paths+=`<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.w||2.4}"${s.dash?` stroke-dasharray="${s.dash}"`:''} class="tsc-line" stroke-linecap="round" stroke-linejoin="round"/>`;
    reg.series.push({ nome:s.nome, cor:s.cor, vals:s.vals.map(p=>p.v), pcts:P.map(p=>pctT(p[1])) }); });
  _TSC[id]=reg;
  const dots=series.map((s,si)=>`<i class="tsc-dot" data-s="${si}" style="border-color:${s.cor}"></i>`).join('');
  const legend = series.length>1?`<div class="tsc-legend">${series.map(s=>`<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`:'';
  return `<div class="tsc" data-tsc="${id}"${opts.altura?` style="--tsc-h:${opts.altura}"`:''}>${legend}
    <div class="tsc-plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="tsc-svg"><defs>${defs}</defs>${grid}${metaSvg}${paths}</svg>
      <div>${yl}</div><div>${xlab}</div><div class="tsc-cross"></div>${dots}<div class="tsc-read"></div></div></div>`;
}
function _tscMove(clientX, target){
  const cont=target&&target.closest&&target.closest('[data-tsc]');
  document.querySelectorAll('.tsc.on').forEach(c=>{ if(c!==cont) c.classList.remove('on'); });
  if(!cont) return; const reg=_TSC[cont.getAttribute('data-tsc')]; if(!reg) return;
  const plot=cont.querySelector('.tsc-plot'); const rect=plot.getBoundingClientRect(); if(!rect.width) return;
  const vx=Math.max(0,Math.min(reg.W,(clientX-rect.left)/rect.width*reg.W));
  let idx=0,best=Infinity; reg.xs.forEach((x,i)=>{ const dd=Math.abs(x-vx); if(dd<best){best=dd;idx=i;} });
  cont.classList.add('on'); const leftPct=reg.xs[idx]/reg.W*100;
  const cross=cont.querySelector('.tsc-cross'); if(cross) cross.style.left=leftPct.toFixed(2)+'%';
  cont.querySelectorAll('.tsc-dot').forEach(dot=>{ const s=reg.series[+dot.getAttribute('data-s')]; dot.style.left=leftPct.toFixed(2)+'%'; dot.style.top=(s.pcts[idx]||0).toFixed(2)+'%'; });
  const read=cont.querySelector('.tsc-read');
  if(read){ read.innerHTML=`<div class="h">${esc(reg.readX(reg.xraw[idx]))}</div>`+reg.series.map(s=>`<div class="r"><i style="background:${s.cor}"></i><span>${esc(s.nome)}</span><b>${esc(reg.fmt(s.vals[idx]))}</b></div>`).join('');
    read.style.left=leftPct.toFixed(2)+'%'; read.classList.toggle('flip', leftPct>62); }
}
document.addEventListener('mousemove',(e)=>_tscMove(e.clientX,e.target),{passive:true});
document.addEventListener('touchstart',(e)=>{ if(e.touches&&e.touches[0]) _tscMove(e.touches[0].clientX,e.target); },{passive:true});
document.addEventListener('touchmove',(e)=>{ if(e.touches&&e.touches[0]) _tscMove(e.touches[0].clientX,e.target); },{passive:true});

function erro(msg){
  document.getElementById('sub').textContent='';
  document.getElementById('conteudo').innerHTML=`<div class="card"><div class="estado">${esc(msg)}</div></div>`;
}

function render(d, sessao){
  _ULT=d;
  document.getElementById('titulo').textContent=`Acompanhamento AMS — ${d.cliente||'Cliente'}`;
  document.getElementById('sub').textContent=`Apuração ${APUR[d.apuracao]||d.apuracao} · banco de horas dentro do ciclo`;
  const c=d.ciclo||{}; const meses=c.meses||[];
  document.getElementById('ciclo').innerHTML = meses.length
    ? `Ciclo vigente<br><strong>${esc(labelMes(meses[0]))}${meses.length>1?'–'+esc(labelMes(meses[meses.length-1])):''}</strong>` : '';

  const H=d.horas||{}; const V=d.valor||{}; const CH=d.chamados||{};
  // Só as horas faturáveis consomem o pacote; o total do ciclo entra como contexto.
  const pool=H.contratadasCiclo||0; const cons=H.consumidoSeg||0;
  const fat=H.faturavelSeg!=null?H.faturavelSeg:cons; const fatH=fat/3600;
  const pct=pool?Math.round(fatH/pool*100):0;
  const over=H.excedenteSeg>0;
  const corBar=over?'var(--err)':(pct>=85?'var(--amarelo)':'var(--teal)');
  const kClass=over?'bad':(pct>=85?'warn':'ok');

  // KPIs
  const kpis=`<div class="kpis">
    <div class="kpi ${kClass}"><div class="v">${pct}%</div><div class="l">Consumo do ciclo</div><div class="s">${fmtH(fat)} faturáveis de ${pool}h</div></div>
    <div class="kpi ok"><div class="v">${fmtH(H.bancoSeg||0)}</div><div class="l">Banco de horas</div><div class="s">disponível no ciclo</div></div>
    <div class="kpi ${over?'bad':''}"><div class="v">${over?fmtH(H.excedenteSeg):'0h'}</div><div class="l">Excedente</div><div class="s">${over&&V.hora?fmtBRL(V.excedente)+' a autorizar':'dentro do pacote'}</div></div>
    <div class="kpi"><div class="v">${CH.abertosTotal||0}/${CH.fechadosTotal||0}</div><div class="l">Chamados (abertos/fechados)</div><div class="s">no ciclo</div></div>
  </div>`;

  // Barra de horas
  const w=pool?Math.min(100,fatH/pool*100):0;
  const horasCard=`<div class="card"><h2>Horas do ciclo</h2>
    <div class="bar"><i style="width:${w.toFixed(1)}%;background:${corBar}"></i></div>
    <div class="bar-l"><span><strong>${fmtH(fat)}</strong> faturáveis de <strong>${pool}h</strong> contratadas (${pct}%)${cons!==fat?` · ${fmtH(cons)} no total`:''}</span>
      <span>${over?`excedente <strong>${fmtH(H.excedenteSeg)}</strong>`:`banco <strong>${fmtH(H.bancoSeg||0)}</strong> disponível`}</span></div>
    ${meses.length>1?`<div style="font-weight:600;margin:14px 0 2px;font-size:13px">Por mês no ciclo${H.minMes||H.tetoMes?` <span style="color:var(--muted);font-weight:400">(mín ${H.minMes||'–'}h · teto ${H.tetoMes||'–'}h)</span>`:''}</div>
      <div class="months">${meses.map(ym=>{
        const seg=(H.porMes&&H.porMes[ym])||0, mh=seg/3600, lo=H.minMes&&mh<H.minMes, hi=H.tetoMes&&mh>H.tetoMes;
        return `<div class="mc ${hi?'hi':(lo?'lo':'')}"><div class="mm">${esc(labelMes(ym))}</div><div class="mh">${fmtH(seg)}</div>
          ${hi?`<div class="mm" style="color:#B91C1C">&gt; teto</div>`:(lo?`<div class="mm" style="color:#B45309">&lt; mín</div>`:'')}</div>`;
      }).join('')}</div>`:''}
    ${over?`<div class="note">⚠ O consumo passou das ${pool}h do ciclo. O excedente é tratado mediante autorização prévia e faturado junto com o ciclo.</div>`
      :`<div class="note">O banco de horas vale até o fim do ciclo e não acumula para o próximo.</div>`}
  </div>`;

  // Chamados abertos × fechados — série semanal (premium) com fallback mensal.
  const fmtDM=(x)=>x.slice(8,10)+'/'+x.slice(5,7);
  const sem=CH.semanas||[];
  const liq=(CH.abertosTotal||0)-(CH.fechadosTotal||0);
  const totFoot=`<div class="bar-l" style="margin-top:10px"><span>Total no ciclo: <strong>${CH.abertosTotal||0}</strong> abertos · <strong>${CH.fechadosTotal||0}</strong> fechados</span>
      <span>Backlog líquido: <strong style="color:${liq>0?'#B45309':'#188918'}">${liq>0?'+':''}${liq}</strong></span></div>`;
  let chamCard;
  if(sem.length>=2){
    chamCard=`<div class="card"><h2>Chamados por período <span style="font-weight:400;color:var(--muted);font-size:12px">(semanal)</span></h2>
      ${tsChart([
        {nome:'Abertos',cor:'#0070F2',vals:sem.map(s=>({x:s.ini,v:s.ab})),tipo:'area'},
        {nome:'Fechados',cor:'#188918',vals:sem.map(s=>({x:s.ini,v:s.fe})),tipo:'line'}
      ],{fmt:(v)=>String(Math.round(v)),yfmt:(v)=>String(Math.round(v)),xlabel:fmtDM,readX:(x)=>'Semana de '+fmtDM(x),altura:'240px'})}
      ${totFoot}</div>`;
  } else {
    const maxC=Math.max(1,...meses.map(m=>Math.max((CH.abertosPorMes&&CH.abertosPorMes[m])||0,(CH.fechadosPorMes&&CH.fechadosPorMes[m])||0)));
    chamCard=`<div class="card"><h2>Chamados por período</h2>
      <div class="legend"><span><i style="background:var(--cerceta)"></i>Abertos</span><span><i style="background:var(--musgo)"></i>Fechados</span></div>
      <div class="cham" style="margin-top:10px">${meses.map(ym=>{
        const ab=(CH.abertosPorMes&&CH.abertosPorMes[ym])||0, fe=(CH.fechadosPorMes&&CH.fechadosPorMes[ym])||0;
        return `<div class="cham-row"><div class="m">${esc(labelMes(ym))}</div>
          <div class="cham-bars">
            <div class="b" style="width:${Math.max(2,ab/maxC*100)}%;background:var(--cerceta)"><span>${ab}</span></div>
            <div class="b" style="width:${Math.max(2,fe/maxC*100)}%;background:var(--musgo)"><span>${fe}</span></div>
          </div></div>`;
      }).join('')}</div>${totFoot}</div>`;
  }

  // Por causa (labels/componentes) — treemap proporcional
  const causa=(CH.porCausa||[]);
  const causaCard=causa.length?`<div class="card"><h2>Classificação dos chamados <span style="font-weight:400;color:var(--muted);font-size:12px">(componentes / labels · área = nº de chamados)</span></h2>
    ${treemap(causa.map(x=>({nome:x.nome,valor:x.n})),{fmt:(v)=>v+' chamado'+(v===1?'':'s')})}</div>`:'';

  document.getElementById('conteudo').innerHTML =
    (sessao?barraEu(sessao):'') + kpis + listaCard(d) + horasCard + chamCard + causaCard;
  if(sessao) ligaBarra();
  ligaFiltroChamados(d);
}

// ---- 📋 Chamados do ciclo (o que o cliente pediu para acompanhar) ----
// Uma linha por chamado: chave, assunto, situação, datas e as horas gastas. A fase vem
// da CATEGORIA do status no Jira, não do nome — fluxo novo não quebra a cor.
let _ULT=null; let _FASE='';   // filtro ativo ('' = todas)
const FASE_ROT={ aberto:'Em aberto', andamento:'Em andamento', concluido:'Concluído' };
function listaCard(d){
  const lista=((d.chamados||{}).lista)||[];
  if(!lista.length) return `<div class="card"><h2>Chamados do ciclo</h2>
    <div class="estado">Nenhum chamado no ciclo atual.</div></div>`;
  const cont={ aberto:0, andamento:0, concluido:0 };
  lista.forEach(x=>{ if(cont[x.fase]!=null) cont[x.fase]++; });
  const vis=_FASE?lista.filter(x=>x.fase===_FASE):lista;
  const mostraV=!!(d.valor&&d.valor.hora);
  const linhas=vis.map(x=>`<tr>
    <td class="ch-k">${esc(x.k)}</td>
    <td>${esc(x.resumo)}${x.tipo?`<div style="color:var(--muted);font-size:11.5px">${esc(x.tipo)}</div>`:''}</td>

// ===========================================================================
// 🔐 ÁREA DO CLIENTE — conta com e-mail e senha
// A sessão fica no localStorage e viaja no cabeçalho Authorization, NUNCA em cookie:
// é isso que faz esta página funcionar tanto sozinha quanto dentro de um <iframe> no
// site da Dexterity, sem depender de cookie de terceiros (que o navegador bloqueia).
// Em iframe o localStorage também pode ser bloqueado — por isso todo acesso é protegido
// e cai para memória: a pessoa continua usando, só precisa entrar de novo depois.
// ===========================================================================
const SKEY='dexterity_portal_sessao';
let _memSessao=null;
function sessaoLe(){ try{ return JSON.parse(localStorage.getItem(SKEY)||'null')||_memSessao; }catch(e){ return _memSessao; } }
function sessaoGrava(s){ _memSessao=s; try{ localStorage.setItem(SKEY,JSON.stringify(s)); }catch(e){} }
function sessaoLimpa(){ _memSessao=null; try{ localStorage.removeItem(SKEY); }catch(e){} }

async function api(acao, opcoes){
  const o=opcoes||{}; const s=sessaoLe();
  const headers={};
  if(o.corpo) headers['Content-Type']='application/json';
  if(o.comSessao && s && s.token) headers.Authorization='Bearer '+s.token;
  // Só a pré-visualização do gestor (aberta pelo Hub) manda a identidade do Jira — e ela
  // vive na memória desta página, nunca no localStorage. O cliente não passa por aqui.
  if(o.jira && o.jira.email && o.jira.token){ headers['x-jira-email']=o.jira.email; headers['x-jira-token']=o.jira.token; }
  const qs='/api/config?pcli='+encodeURIComponent(acao)+(o.qs||'');
  const r=await fetch(qs,{ method:o.corpo?'POST':'GET', headers, body:o.corpo?JSON.stringify(o.corpo):undefined });
  let d=null; try{ d=await r.json(); }catch(e){ d=null; }
  return { st:r.status, d:d||{} };
}

// ---- painel (área logada) ----
async function carregaPainel(){
  const s=sessaoLe();
  if(!s||!s.token){ telaLogin(''); return; }

  $c().innerHTML='<div class="estado">Carregando o painel…</div>';

  if(r.st===401){ sessaoLimpa(); telaLogin('A sua sessão expirou. Entre de novo.'); return; }

// ===========================================================================
// 🌐 PORTAL DO PROJETO — o que o cliente vê de um projeto publicado (2026-09-28)
// A mesma página, outro modo: quando `pcli=dados` lista projetos publicados para o contrato
// da conta, a área abre aqui (seletor quando há mais de um; a aba "📞 Chamados e horas" só
// para contrato AMS, com o render() de sempre). Tudo o que aparece vem de UM pedido,
// `pcli=projeto&p=KEY`, cujo conteúdo o servidor monta por allowlist — esta tela só desenha:
// nada é calculado nem filtrado aqui que o servidor já não tenha decidido. Links externos
// só abrem se forem http(s) (hrefOk), sempre em nova aba. A pré-visualização do gestor
// (?preview=KEY) usa o MESMO desenho com a identidade recebida por postMessage do Hub.
// ===========================================================================
let _PJ=null;   // { d: resposta de pcli=dados, s: sessão, key, aba:'projeto'|'ams', pay:{KEY: payload}, preview:{email,token}|null }
const PJ_KEY='dexterity_portal_projeto';   // último projeto aberto (conforto; o escopo é sempre do servidor)
const hrefOk=(u)=>/^https?:\/\/[^\s<>"']+$/i.test(String(u||''))?String(u).slice(0,900):'';
const dmBR=(iso)=>/^\d{4}-\d{2}-\d{2}/.test(iso||'')?iso.slice(8,10)+'/'+iso.slice(5,7):'';
const hojeISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date());
const diasEntre=(a,b)=>Math.round((Date.parse(String(b).slice(0,10)+'T12:00:00Z')-Date.parse(String(a).slice(0,10)+'T12:00:00Z'))/86400000);
const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const diaSem=(iso)=>DIAS_SEM[new Date(String(iso).slice(0,10)+'T12:00:00Z').getUTCDay()]||'';
const nl=(s)=>esc(s).replace(/\n/g,'<br>');
// Rótulos em português claro (a mesma escala de cores do 📅 Cronograma interno).
const PJ_ST={ concluido:['Concluída','var(--musgo)'], andamento:['Em andamento','var(--cerceta)'], risco:['Atenção','var(--amarelo)'],
  atrasado:['Atrasada','var(--err)'], planejado:['Planejada','var(--muted2)'] };
const PJ_SEM={ ok:['No prazo','ok'], atencao:['Atenção','warn'], atrasado:['Com atraso','bad'] };
const DEC_ST={ aberta:['Em aberto','warn'], reprazada:['Prazo revisado','info'], escalada:['Escalada','bad'] };
const NIV={ alto:3, medio:2, baixo:1 }; const NIV_ROT={ alto:'alto', medio:'médio', baixo:'baixo' };
const LNK_ICO={ planilha:'📊', documento:'📄', pasta:'📂', site:'🌐', video:'🎬', apresentacao:'📽️' };

function pjEntra(d, s){
  let lembrado=''; try{ lembrado=localStorage.getItem(PJ_KEY)||''; }catch(e){}
  const key=d.projetos.some(p=>p.key===lembrado)?lembrado:d.projetos[0].key;
  _PJ={ d, s, key, aba:'projeto', pay:{}, preview:null };
  pjMostra();
}
// Desenha o modo projeto conforme a aba; busca o payload quando ainda não está em memória.
async function pjMostra(){
  const P=_PJ.pay[_PJ.key]||null;
  if(_PJ.aba==='ams'){ render(_PJ.d,_PJ.s); pjCabecalho(P); pjInsereNav(); return; }
  pjCabecalho(P);
  $c().innerHTML=(_PJ.s?barraEu(_PJ.s):pjBanner())+pjNav()
    +'<div id="pj-corpo">'+(P?pjCorpo(P):'<div class="card"><div class="estado">Carregando o projeto…</div></div>')+'</div>';
  if(_PJ.s) ligaBarra();
  if(P) pjCrRola(); else await pjCarrega();
}
async function pjCarrega(){
  const st=_PJ, key=st.key;
  const r=st.preview ? await api('preview',{ qs:'&p='+encodeURIComponent(key), jira:st.preview })
                     : await api('projeto',{ qs:'&p='+encodeURIComponent(key), comSessao:true });
  if(_PJ!==st||st.key!==key||st.aba!=='projeto') return;   // trocou de projeto/aba (ou saiu) enquanto carregava
  if(r.st===401&&!st.preview){ sessaoLimpa(); telaLogin('A sua sessão expirou. Entre de novo.'); return; }
  const corpo=document.getElementById('pj-corpo');
  if(r.st!==200||!r.d||r.d.ok===false||r.d.v!==1){
    const m=(r.st===401||r.st===403)?'A pré-visualização precisa de um gestor conectado no Hub.':((r.d&&r.d.erro)||'Não foi possível carregar o projeto agora. Tente de novo em instantes.');
    if(corpo) corpo.innerHTML=`<div class="card"><div class="estado">${esc(m)}</div></div>`;
    return;
  }
  st.pay[key]=r.d; pjCabecalho(r.d);
  if(corpo){ corpo.innerHTML=pjCorpo(r.d); pjCrRola(); }
}
function pjCabecalho(P){
  document.body.classList.add('pj');
  const pr=((_PJ.d&&_PJ.d.projetos)||[]).find(p=>p.key===_PJ.key)||{};
  const cliente=(P&&P.cliente)||(_PJ.s&&_PJ.s.cliente)||'';
  const nome=(P&&P.projeto&&P.projeto.nome)||pr.nome||_PJ.key;
  document.getElementById('titulo').innerHTML=`${cliente?`<span class="cli">${esc(cliente)}</span> <span class="sep">·</span> `:''}${esc(nome)}`;
  document.title=`${cliente?cliente+' · ':''}${nome} · Dexterity`;
  document.getElementById('sub').innerHTML=`<span>Portal do projeto</span>`
    +(P?` <span>· atualizado <span id="pj-atu">${esc(pjHaQuanto(P.atualizadoEm))}</span></span> <button class="lnk" id="pj-rec" title="Recarregar os dados">↻ atualizar</button>`:'');
  document.getElementById('ciclo').innerHTML=P?pjAcoes(P):'';
  const f=document.querySelector('.foot');
  if(f) f.innerHTML=(P?pjAcoes(P):'')+'<span>Portal somente-leitura · Dexterity IT · o progresso vem do acompanhamento do projeto</span>';
}
// Teams em destaque e a pasta do projeto — no cabeçalho e repetidos no rodapé.
function pjAcoes(P){
  const t=hrefOk(P.teamsUrl), p=hrefOk(P.pasta); if(!t&&!p) return '';
  return `<div class="pj-acoes">${t?`<a class="pjb pri" href="${escA(t)}" target="_blank" rel="noopener noreferrer">💬 Canal do Teams</a>`:''}${p?`<a class="pjb" href="${escA(p)}" target="_blank" rel="noopener noreferrer">📂 Pasta do projeto</a>`:''}</div>`;
}
function pjHaQuanto(iso){
  const t=Date.parse(iso||''); if(!Number.isFinite(t)) return '';
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  return m<1?'agora mesmo':m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`em ${dataBR(String(iso).slice(0,10))}`;
}
setInterval(()=>{ const P=_PJ&&_PJ.pay[_PJ.key]; const el=document.getElementById('pj-atu'); if(P&&el) el.textContent=pjHaQuanto(P.atualizadoEm); },60000);
function pjNav(){
  const ps=(_PJ.d&&_PJ.d.projetos)||[]; const ams=!!(_PJ.d&&_PJ.d.tipo==='ams');
  if(ps.length<2&&!ams) return '';
  const sel=ps.length>1?`<select class="pj-sel" id="pj-sel" aria-label="Projeto">${ps.map(p=>`<option value="${escA(p.key)}"${p.key===_PJ.key?' selected':''}>${esc(p.nome||p.key)}</option>`).join('')}</select>`:'';
  const tabs=ams?`<div class="pj-tabs" role="tablist"><button class="pj-tab" role="tab" data-pj-aba="projeto" aria-selected="${_PJ.aba==='projeto'}">🌐 Projeto</button><button class="pj-tab" role="tab" data-pj-aba="ams" aria-selected="${_PJ.aba==='ams'}">📞 Chamados e horas</button></div>`:'';
  return `<div class="pj-nav" id="pj-nav">${sel}<span class="sp"></span>${tabs}</div>`;
}
// Na aba AMS o render() de sempre desenha o conteúdo; o seletor/abas entram logo abaixo da barra "Conectado como".
function pjInsereNav(){
  const d=document.createElement('div'); d.innerHTML=pjNav(); const nav=d.firstElementChild; if(!nav) return;
  const eu=document.querySelector('#conteudo .eu'); if(eu) eu.after(nav); else $c().prepend(nav);
}
function pjBanner(){ return `<div class="pj-prev">👁 <b>Pré-visualização</b> — é exatamente isto que o cliente vê. Aberta pelo Dexterity Hub com a sua identidade de gestor; nada fica guardado neste navegador.</div>`; }
// Um listener só, delegado: ↻, abas e seletor são recriados a cada desenho.
document.addEventListener('click',(e)=>{
  if(!_PJ||!e.target.closest) return;
  if(e.target.closest('#pj-rec')){ delete _PJ.pay[_PJ.key]; _PJ.aba='projeto'; pjMostra(); return; }
  const tab=e.target.closest('[data-pj-aba]'); if(tab){ _PJ.aba=tab.getAttribute('data-pj-aba'); pjMostra(); }
});
document.addEventListener('change',(e)=>{
  if(!_PJ||!e.target.closest) return; const sel=e.target.closest('#pj-sel'); if(!sel) return;
  _PJ.key=sel.value; _PJ.aba='projeto'; try{ localStorage.setItem(PJ_KEY,_PJ.key); }catch(x){} pjMostra();
});
// O cronograma é desenhado na largura disponível: ao redimensionar, só ele é refeito.
let _pjRs=null;
window.addEventListener('resize',()=>{ if(!_PJ||_PJ.aba!=='projeto') return; clearTimeout(_pjRs); _pjRs=setTimeout(()=>{
  const P=_PJ&&_PJ.pay[_PJ.key]; const c=document.getElementById('pj-cr'); if(!P||!c) return;
  const d=document.createElement('div'); d.innerHTML=pjCronogramaCard(P.epicos,hojeISO()); c.replaceWith(d.firstElementChild); pjCrRola(); },200); });

// ---- os blocos, na ordem do desenho: cada um só quando o gestor o ligou E há conteúdo ----
function pjCorpo(P){
  const B=P.blocos||{}; const on=(k)=>B[k]!==false; const hoje=hojeISO(); const eps=P.epicos||[]; const out=[];
  if(P.apresentacao) out.push(`<div class="card pj-apre">${nl(P.apresentacao)}</div>`);
  if(on('progresso')&&P.progresso&&(eps.length||(P.progresso.itens&&P.progresso.itens.total))) out.push(pjProgresso(P.progresso));
  if(on('cronograma')&&eps.length) out.push(pjCronogramaCard(eps,hoje));
  if(on('pendencias')&&(P.pendencias||[]).length) out.push(pjPendencias(P.pendencias,hoje));
  if(on('decisoes')&&(P.decisoes||[]).length) out.push(pjDecisoes(P.decisoes,hoje));
  if(on('riscos')&&(P.riscos||[]).length) out.push(pjRiscos(P.riscos));
  if(on('reunioes')&&(P.reunioes||[]).length) out.push(pjReunioes(P.reunioes));
  if(on('equipe')&&(P.equipe||[]).length) out.push(pjEquipe(P.equipe));
  if(on('faq')&&(P.faq||[]).length) out.push(pjFaq(P.faq));
  if(on('links')&&(P.links||[]).length) out.push(pjLinks(P.links));
  if(!out.length) return `<div class="card"><div class="pj-vazio"><b>O portal deste projeto está sendo preparado.</b>Em breve você acompanha aqui o progresso, as pendências e as próximas reuniões.</div></div>`;
  return out.join('');
}
function pjProgresso(p){
  const sem=PJ_SEM[p.semaforo]||PJ_SEM.ok; const it=p.itens||{}; const mk=p.marcos||{};
  const kc=p.semaforo==='atrasado'?'bad':p.semaforo==='atencao'?'warn':'ok'; const at=p.maiorAtrasoDias||0;
  return `<div class="card"><h2>Progresso do projeto <span class="pill ${sem[1]}">${sem[0]}</span>${p.previsaoFim?` <span class="n">previsão de término ${esc(dataBR(p.previsaoFim))}</span>`:''}</h2>
    <div class="kpis">
      <div class="kpi ${kc}"><div class="v">${Number(p.pct)||0}%</div><div class="l">Progresso</div><div class="s">${it.concluidos||0} de ${it.total||0} atividades concluídas</div></div>
      <div class="kpi ${mk.total&&mk.concluidos===mk.total?'ok':''}"><div class="v">${mk.concluidos||0}/${mk.total||0}</div><div class="l">Marcos concluídos</div><div class="s">${mk.total?'marcos do projeto':'sem marcos definidos'}</div></div>
      <div class="kpi"><div class="v">${mk.proximo?esc(dmBR(mk.proximo.data)):'—'}</div><div class="l">Próximo marco</div><div class="s" title="${escA(mk.proximo?mk.proximo.nome:'')}">${mk.proximo?esc(mk.proximo.nome):'nenhum marco à frente'}</div></div>
      <div class="kpi ${at>0?'bad':'ok'}"><div class="v">${at} dia${at===1?'':'s'}</div><div class="l">Maior atraso</div><div class="s">${at>0?'em uma etapa com marco vencido':'nenhuma etapa atrasada'}</div></div>
    </div></div>`;
}
// Cronograma simples, sem biblioteca: os nomes das etapas ficam numa coluna HTML fixa (com
// reticências) e só a linha do tempo é SVG — uma barra do início ao marco (preenchida pelo %
// concluído), ◆ no marco, linha tracejada em "hoje", meses como colunas. No celular só a linha
// do tempo rola, já aberta em "hoje"; a coluna dos nomes fica parada.
const CR_ROW=30, CR_TOP=34, CR_BOT=6;
function pjCrTip(e,st,pct){ return `${e.nome||e.k||''}\n${st[0]} · ${pct}% concluído${e.ini?`\nInício ${dataBR(e.ini)}`:''}${e.fim?`\nMarco ${dataBR(e.fim)}`:''}${e.atrasoDias?`\n${e.status==='concluido'?`concluída ${e.atrasoDias} dia(s) depois do marco`:`${e.atrasoDias} dia(s) de atraso`}`:''}`; }
function pjCronogramaCard(eps,hoje){
  const cont=document.getElementById('conteudo'); const larg=Math.max(280,((cont&&cont.clientWidth)||900)-38);
  const LAB=larg<600?128:Math.min(220,Math.round(larg*0.3));
  const lab=eps.map(e=>{ const st=PJ_ST[e.status]||PJ_ST.planejado; const pct=Math.min(100,Math.max(0,Number(e.pct)||0));
    return `<div class="r" title="${escA(pjCrTip(e,st,pct))}"><i style="background:${st[1]}"></i><span>${esc(e.nome||e.k||'')}</span></div>`; }).join('');
  return `<div class="card" id="pj-cr"><h2>Cronograma <span class="n">${eps.length} etapa${eps.length===1?'':'s'} · ◆ marco · linha tracejada = hoje</span></h2>
    <div class="pj-cr-wrap"><div class="pj-cr-lab" style="flex-basis:${LAB}px"><div class="h"></div>${lab}</div><div class="pj-cr">${pjCronogramaSVG(eps,hoje,larg-LAB-1)}</div></div>
    <div class="pj-cr-dica">↔ deslize a linha do tempo para ver os outros meses</div>
    <div class="pj-leg">${Object.values(PJ_ST).map(([rot,cor])=>`<span><i style="background:${cor}"></i>${rot}</span>`).join('')}<span><i class="mk"></i>marco</span></div></div>`;
}
function pjCronogramaSVG(eps,hoje,larg){
  const ROW=CR_ROW, TOP=CR_TOP, BOT=CR_BOT;
  const datas=[hoje]; eps.forEach(e=>{ if(e.ini) datas.push(e.ini); if(e.fim) datas.push(e.fim); });
  const min=datas.reduce((a,b)=>b<a?b:a), max=datas.reduce((a,b)=>b>a?b:a);
  const m0=min.slice(0,7)+'-01';
  const dFim=new Date(max.slice(0,7)+'-01T12:00:00Z'); dFim.setUTCMonth(dFim.getUTCMonth()+1); const mf=dFim.toISOString().slice(0,10);
  const meses=[]; for(const d=new Date(m0+'T12:00:00Z'); d.toISOString().slice(0,10)<mf; d.setUTCMonth(d.getUTCMonth()+1)) meses.push(d.toISOString().slice(0,7));
  const n=meses.length; const MW=Math.max(56,Math.floor((larg-16)/n)); const W=MW*n; const H=TOP+ROW*eps.length+BOT;
  const total=diasEntre(m0,mf)||1; const X=(iso)=>diasEntre(m0,iso)/total*W;
  // viewBox com 8px de folga dos dois lados: o ◆ de um marco no 1º/último dia não fica cortado
  let g=`<svg viewBox="-8 0 ${W+16} ${H}" width="${W+16}" height="${H}" role="img" aria-label="Linha do tempo por etapa">`;
  meses.forEach((ym,i)=>{ const x=i*MW; g+=`<line x1="${x}" y1="${TOP-4}" x2="${x}" y2="${H-BOT}" stroke="var(--linha2)"/><text class="mes" x="${x+4}" y="13">${esc(labelMes(ym))}</text>`; });
  eps.forEach((e,i)=>{
    const y=TOP+i*ROW; const st=PJ_ST[e.status]||PJ_ST.planejado; const cor=st[1]; const pct=Math.min(100,Math.max(0,Number(e.pct)||0));
    if(i%2) g+=`<rect x="-8" y="${y}" width="${W+16}" height="${ROW}" fill="var(--trilho)" opacity=".45"/>`;
    const tip=pjCrTip(e,st,pct); const ini=e.ini||'', fim=e.fim||'';
    if(ini||fim){
      const a=ini||fim, b=fim||(hoje>ini?hoje:ini); const x1=X(a), x2=Math.max(X(b),x1+4), w=x2-x1;
      g+=`<g><title>${esc(tip)}</title><rect x="${x1.toFixed(1)}" y="${y+8}" width="${w.toFixed(1)}" height="14" rx="4" fill="${cor}" opacity=".22"${!fim?` stroke="${cor}" stroke-dasharray="4 3"`:''}/>`;
      const wp=w*pct/100; if(wp>0) g+=`<rect x="${x1.toFixed(1)}" y="${y+8}" width="${wp.toFixed(1)}" height="14" rx="4" fill="${cor}"/>`;
      if(fim){ const mx=X(fim), my=y+15; g+=`<polygon points="${mx.toFixed(1)},${my-7} ${(mx+7).toFixed(1)},${my} ${mx.toFixed(1)},${my+7} ${(mx-7).toFixed(1)},${my}" fill="${cor}" stroke="var(--cartao)" stroke-width="1.5"/>`; }
      // o % fica depois do marco (legível fora da barra); sem espaço à direita, antes da barra
      if(x2+44<W) g+=`<text class="pc" x="${(x2+12).toFixed(1)}" y="${y+19}">${pct}%</text>`;
      else if(x1>40) g+=`<text class="pc" x="${(x1-8).toFixed(1)}" y="${y+19}" text-anchor="end">${pct}%</text>`;
      g+='</g>';
    } else g+=`<text class="sem" x="8" y="${y+ROW/2+4}">sem datas definidas</text>`;
  });
  const xh=X(hoje);
  g+=`<line x1="${xh.toFixed(1)}" y1="${TOP-4}" x2="${xh.toFixed(1)}" y2="${H-BOT}" stroke="var(--err)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="hoje" x="${(xh+4).toFixed(1)}" y="${TOP-8}">hoje</text>`;
  return g.replace('<svg ',`<svg data-hoje="${(xh+8).toFixed(0)}" `)+'</svg>';
}
// Linha do tempo maior que o espaço (celular): abre já mostrando "hoje" e liga a dica de deslizar.
function pjCrRola(){
  const card=document.getElementById('pj-cr'); const c=card&&card.querySelector('.pj-cr'); const svg=c&&c.querySelector('svg'); if(!c||!svg) return;
  if(c.scrollWidth>c.clientWidth+1){ c.scrollLeft=Math.max(0,(+svg.getAttribute('data-hoje')||0)-c.clientWidth*0.6); card.classList.add('rola'); }
}
function pjPendencias(pend,hoje){
  const item=(x)=>{ const dias=Number(x.dias)||0; const venc=x.prazo&&x.prazo<hoje, hj=x.prazo===hoje;
    return `<div class="pj-it"><div class="ico">${x.lado==='dexterity'?'🛠':'🙋'}</div><div class="tx"><div class="t">${esc(x.titulo)}${x.k?` <span class="tag">${esc(x.k)}</span>`:''}</div>
      <div class="m"><span>${dias>0?`há ${dias} dia${dias===1?'':'s'}`:'desde hoje'}</span>${x.prazo?`<span>prazo ${esc(dataBR(x.prazo))}</span>`:''}${venc?'<span class="pill bad">prazo vencido</span>':hj?'<span class="pill warn">vence hoje</span>':''}</div></div></div>`; };
  const suas=pend.filter(x=>x.lado!=='dexterity'), nossas=pend.filter(x=>x.lado==='dexterity');
  return `<div class="card"><h2>O que a Dexterity precisa de você${suas.length?` <span class="pill warn">${suas.length}</span>`:''}</h2>
    ${suas.length?`<div class="pj-lista">${suas.map(item).join('')}</div>`:'<div class="note">Nada pendente com você neste momento.</div>'}
    ${nossas.length?`<details class="pj-mais"><summary>Com a Dexterity (${nossas.length})</summary><div class="pj-lista">${nossas.map(item).join('')}</div></details>`:''}</div>`;
}
function pjDecisoes(ds,hoje){
  return `<div class="card"><h2>Decisões a tomar <span class="pill warn">${ds.length}</span></h2><div class="pj-lista">${ds.map(d=>{ const st=DEC_ST[d.status]||DEC_ST.aberta; const ata=hrefOk(d.ata);
    return `<div class="pj-it"><div class="ico">⚖️</div><div class="tx"><div class="t">${esc(d.titulo)}</div>${d.contexto?`<div class="d">${nl(d.contexto)}</div>`:''}
      <div class="m"><span class="pill ${st[1]}">${st[0]}</span>${d.dono?`<span>com ${esc(d.dono)}</span>`:''}${d.prazo?`<span>até ${esc(dataBR(d.prazo))}</span>`:''}${d.prazo&&d.prazo<hoje?'<span class="pill bad">prazo vencido</span>':''}${ata?`<a href="${escA(ata)}" target="_blank" rel="noopener noreferrer">📄 ata</a>`:''}</div></div></div>`; }).join('')}</div></div>`;
}
// Severidade = probabilidade × impacto (quando falta um, vale o outro): ≥6 alto · ≥3 médio · senão baixo.
function pjSevPeso(r){ const p=NIV[r.prob]||0, i=NIV[r.impacto]||0; const a=p||i, b=i||p; return a*b; }
function pjSev(r){ const s=pjSevPeso(r); if(!s) return null; return s>=6?['alto','bad']:s>=3?['médio','warn']:['baixo','ok']; }
function pjRiscos(rs){
  const item=(r)=>{ const sev=pjSev(r); const enc=r.status==='encerrado', mit=r.status==='mitigado';
    return `<div class="pj-it"><div class="ico">${enc?'✅':mit?'🛡️':'⚠️'}</div><div class="tx"><div class="t">${esc(r.titulo)}</div>${r.mitigacao?`<div class="d"><b>Como estamos tratando:</b> ${nl(r.mitigacao)}</div>`:''}
      <div class="m">${sev?`<span class="pill ${enc?'mut':sev[1]}">risco ${sev[0]}</span>`:''}${r.prob?`<span>probabilidade ${NIV_ROT[r.prob]||esc(r.prob)}</span>`:''}${r.impacto?`<span>impacto ${NIV_ROT[r.impacto]||esc(r.impacto)}</span>`:''}${mit?'<span class="pill ok">mitigado</span>':''}${enc?'<span class="pill mut">encerrado</span>':''}${r.resp?`<span>acompanha: ${esc(r.resp)}</span>`:''}</div></div></div>`; };
  const abertos=rs.filter(r=>r.status!=='encerrado').sort((a,b)=>pjSevPeso(b)-pjSevPeso(a)), enc=rs.filter(r=>r.status==='encerrado');
  return `<div class="card"><h2>Riscos acompanhados${abertos.length?` <span class="n">${abertos.length} em acompanhamento</span>`:''}</h2>
    ${abertos.length?`<div class="pj-lista">${abertos.map(item).join('')}</div>`:'<div class="note">Nenhum risco em aberto.</div>'}
    ${enc.length?`<details class="pj-mais"><summary>Encerrados (${enc.length})</summary><div class="pj-lista">${enc.map(item).join('')}</div></details>`:''}</div>`;
}
// As datas chegam em ISO com o fuso de São Paulo: a hora é lida do texto, não convertida pelo navegador.
function pjHora(iso){ const m=String(iso||'').match(/T(\d{2}):(\d{2})/); return m?`${m[1]}:${m[2]}`:''; }
function pjReunioes(rs){
  return `<div class="card"><h2>Próximas reuniões <span class="n">próximos 30 dias · horário de Brasília</span></h2><div class="pj-lista">${rs.map(r=>{
    const d=String(r.inicio||'').slice(0,10); const hi=pjHora(r.inicio), hf=pjHora(r.fim); const diaTodo=hi==='00:00'&&(!hf||hf==='00:00'); const link=hrefOk(r.link);
    return `<div class="pj-it pj-reu"><div class="dt"><span>${esc(diaSem(d))}</span><b>${esc(dmBR(d))}</b><span>${diaTodo?'dia todo':esc(hi)}</span></div>
      <div class="tx"><div class="t">${esc(r.titulo)}</div><div class="m">${diaTodo?'<span>dia inteiro</span>':`<span>${esc(hi)}${hf?' – '+esc(hf):''}</span>`}${r.local?`<span>📍 ${esc(r.local)}</span>`:''}</div></div>
      ${link?`<div class="ac"><a class="pjb pri" href="${escA(link)}" target="_blank" rel="noopener noreferrer">Entrar na reunião</a></div>`:''}</div>`; }).join('')}</div></div>`;
}
function pjIniciais(n){ const p=String(n||'').trim().split(/\s+/); return (((p[0]||'')[0]||'')+((p.length>1?p[p.length-1]:'')[0]||'')).toUpperCase(); }
function pjContato(c){
  const s=String(c||'').trim(); if(!s) return '';
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return `<a class="c" href="mailto:${escA(s)}">${esc(s)}</a>`;
  const u=hrefOk(s); if(u) return `<a class="c" href="${escA(u)}" target="_blank" rel="noopener noreferrer">${esc(u.replace(/^https?:\/\//,'').slice(0,40))}</a>`;
  return `<div class="c">${esc(s)}</div>`;
}
function pjEquipe(eq){
  return `<div class="card"><h2>Time do projeto <span class="n">${eq.length} pessoa${eq.length===1?'':'s'}</span></h2><div class="pj-eq">${eq.map(p=>`<div class="pj-pes"><div class="av">${esc(pjIniciais(p.nome))}</div><div class="tx"><div class="n">${esc(p.nome)}</div>${p.papel?`<div class="p">${esc(p.papel)}</div>`:''}${pjContato(p.contato)}</div></div>`).join('')}</div></div>`;
}
function pjFaq(fs){
  return `<div class="card"><h2>Perguntas frequentes</h2>${fs.map(f=>`<details class="pj-faq"><summary>${esc(f.pergunta)}</summary><div class="r">${esc(f.resposta)}</div></details>`).join('')}</div>`;
}
function pjLinks(ls){
  const v=ls.map(l=>({ nome:l.nome, tipo:l.tipo, url:hrefOk(l.url) })).filter(l=>l.url); if(!v.length) return '';
  return `<div class="card"><h2>Links úteis</h2><div class="pj-chips">${v.map(l=>`<a class="chip" href="${escA(l.url)}" target="_blank" rel="noopener noreferrer" title="${escA(l.url)}">${LNK_ICO[String(l.tipo||'').toLowerCase()]||'🔗'} <span>${esc(l.nome||l.url)}</span></a>`).join('')}</div></div>`;
}

// ---- 👁 Pré-visualização (?preview=KEY), aberta pelo Hub ----
// O Hub (mesma origem) manda {tipo:'preview', email, token} por postMessage; esta página avisa
// {tipo:'portal-preview-pronto', projeto} a quem a abriu (iframe ou nova aba) assim que está
// ouvindo. Mensagem de outra origem é ignorada; a identidade fica só na memória.
function pjPreview(key){
  const k=String(key||'').trim().toUpperCase();
  cabecalho('Pré-visualização do portal','aguardando o Hub…');
  $c().innerHTML='<div class="card"><div class="estado">Aguardando a identidade do gestor…<br><span style="font-size:12px">Esta pré-visualização só funciona aberta a partir do Dexterity Hub.</span></div></div>';
  const origem=location.origin;
  window.addEventListener('message',(e)=>{
    if(e.origin!==origem) return;
    const m=e.data||{}; if(m.tipo!=='preview'||!m.email||!m.token) return;
    _PJ={ d:null, s:null, key:k, aba:'projeto', pay:{}, preview:{ email:String(m.email), token:String(m.token) } };
    pjMostra();
  });
  const aviso={ tipo:'portal-preview-pronto', projeto:k };
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage(aviso,origem); }catch(e){}
  try{ if(window.opener) window.opener.postMessage(aviso,origem); }catch(e){}
}

(function(){
  const p=new URLSearchParams(location.search);
  const conv=p.get('convite');
  if(conv){ telaConvite(conv); return; }
  const tok=p.get('c');
  if(tok){   // link antigo (?c=<token> do contrato): continua valendo, sem login
    fetch('/api/config?portal='+encodeURIComponent(tok)).then(r=>r.json()).then(d=>{
      if(!d || d.ok===false || d.erro){ erro(d&&d.erro?d.erro:'Não foi possível carregar o painel.'); return; }
      render(d, null);
    }).catch(e=>erro('Falha ao carregar: '+(e&&e.message?e.message:e)));
    return;
  }
  const prev=p.get('preview');
  if(prev){ pjPreview(prev); return; }   // 👁 aberta pelo Hub: identidade do gestor por postMessage
  carregaPainel();
})();
</script>
